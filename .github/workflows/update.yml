name: Update channel wall data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-wall-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    # 單一頻道逾時 15s × 3 請求 × 並行 4,30 組也在 3 分鐘內;超過就是卡住,砍掉讓下一輪接手。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Warn if CSV_URL is not configured
        if: ${{ vars.CSV_URL == '' }}
        run: echo "::warning::Actions variable CSV_URL 未設定,本輪只會抓 channels.csv fixture(測試頻道),不是學生清單。設定方式見 README。"

      - name: Fetch channel data
        env:
          CSV_URL: ${{ vars.CSV_URL }}
        run: node fetch.mjs

      - name: Commit if changed (force-push single commit)
        run: |
          git config user.name "tumt-wall-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- channels.json resolve-cache.json; then
            echo "no data changes"
            exit 0
          fi
          git add channels.json resolve-cache.json
          git commit --amend -m "chore: update channel wall data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push --force
